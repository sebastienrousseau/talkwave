[tool.poetry]
name = "talkwave"
version = "0.0.6"
description = "TalkWave is an AI chatbot for developers written in Python."
authors = ["Sebastien Rousseau <sebastian.rousseau at gmail.com>"]
license = "Apache Software License"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
Flask = ">=2.2.3,<4.0.0"
openai = "^0.27.2"
python-dotenv = "^1.0.0"
requests = "^2.28.2"
tabulate = "^0.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^4.1.0"
ruff = "^0.1.0"
mypy = "^1.5.0"
bandit = "^1.7.0"

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["talkwave", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["talkwave"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=talkwave --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["talkwave"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
